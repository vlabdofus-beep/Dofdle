<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dofusle — le jeu quotidien de l'univers Dofus</title>
  <meta name="description" content="Fan game quotidien et non officiel dans l'univers de Dofus : devine le monstre, le sort, la carte, l'objet, le cri et le juste prix du jour.">
  <meta name="theme-color" content="#172129">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dofusle">
  <meta property="og:title" content="Dofusle, le défi quotidien de l'univers Dofus">
  <meta property="og:description" content="Six défis par jour : monstre, sort, carte, objet, cri et juste prix. Récolte les six Dofus du jour.">
  <meta property="og:url" content="https://dofusle.survifus.online/">
  <meta property="og:image" content="https://dofusle.survifus.online/assets/og-image.jpg">
  <meta name="twitter:image" content="https://dofusle.survifus.online/assets/og-image.jpg">
  <link rel="canonical" href="https://dofusle.survifus.online/">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo Dofusle et les six modes de jeu">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dofusle">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://api.dofusdb.fr" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/philosopher-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/scenes.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <header class="top">
    <a class="brand" href="#" aria-label="Dofusle, accueil">
      <span class="brand-text">
        <span class="brand-name"><span class="brand-word">D<span class="brand-o" aria-hidden="true"></span>fusle</span></span>
        <span class="brand-date" id="krosmoz-date"></span>
      </span>
    </a>
    <div class="top-actions">
      <span class="top-left">
        <button class="icon-btn" id="btn-help" aria-label="Comment jouer" title="Comment jouer">?</button>
        <button class="icon-btn" id="btn-sound" aria-pressed="false" aria-label="Sons du jeu" title="Activer les sons"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="snd-on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="snd-off" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </span>
      <span class="top-right">
        <a class="icon-btn" id="btn-chests" href="#bestiaire" aria-label="Bestiaire et coffres" title="Bestiaire et coffres"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 10.5C3 7 5.5 5 8 5h8c2.5 0 5 2 5 5.5V11H3z" fill="#b8892f"/><path d="M3 11h18v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="#7a4f22"/><path d="M3 11h18" stroke="#f0d28e" stroke-width="1.6"/><path d="M8 5.2v13.6M16 5.2v13.6" stroke="#f0d28e" stroke-width="1.3" opacity=".75"/><rect x="10.3" y="9.6" width="3.4" height="4" rx=".8" fill="#f0d28e"/></svg><span class="chest-badge" id="chest-badge" hidden></span></a>
        <button class="icon-btn" id="btn-stats" aria-label="Statistiques" title="Statistiques"><img src="assets/game/ui/trophy.png" alt=""></button>
      </span>
    </div>
  </header>

  <nav class="dofus-rack" aria-label="Modes de jeu">
    <div class="modes" id="modes"></div>
    <p class="rack-count" id="rack-count" aria-live="polite"></p>
  </nav>

  <main id="app" class="app" tabindex="-1"></main>

  <footer class="foot">
    <p>Fan game non officiel, sans lien avec Ankama Games.
      <button class="link" id="btn-legal">Mentions</button>
      <button class="link" id="btn-cache">Rafraîchir les données</button></p>
  </footer>

  <noscript><p class="noscript">Dofusle a besoin de JavaScript pour fonctionner.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
