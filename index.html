<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dofusle — le jeu quotidien de l'univers Dofus</title>
  <meta name="description" content="Fan game quotidien et non officiel dans l'univers de Dofus : devine le monstre, le sort, la carte, l'objet, le cri et le juste prix du jour.">
  <meta name="theme-color" content="#172129">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dofusle">
  <meta property="og:title" content="Dofusle, le défi quotidien de l'univers Dofus">
  <meta property="og:description" content="Six défis par jour : monstre, sort, carte, objet, cri et juste prix. Récolte les six Dofus du jour.">
  <meta property="og:url" content="https://dofusle.survifus.online/">
  <meta property="og:image" content="https://dofusle.survifus.online/assets/og-image.jpg">
  <meta name="twitter:image" content="https://dofusle.survifus.online/assets/og-image.jpg">
  <link rel="canonical" href="https://dofusle.survifus.online/">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo Dofusle et les six modes de jeu">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dofusle">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://api.dofusdb.fr" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <header class="top">
    <a class="brand" href="#" aria-label="Dofusle, accueil">
      <span class="brand-text">
        <span class="brand-name"><span class="brand-word">D<span class="brand-o" aria-hidden="true"></span>fusle</span></span>
        <span class="brand-date" id="krosmoz-date"></span>
      </span>
    </a>
    <div class="top-actions">
      <button class="icon-btn" id="btn-help" aria-label="Comment jouer" title="Comment jouer">?</button>
      <button class="icon-btn" id="btn-stats" aria-label="Statistiques" title="Statistiques"><img src="assets/game/ui/trophy.png" alt=""></button>
    </div>
  </header>

  <nav class="dofus-rack" aria-label="Modes de jeu">
    <div class="modes" id="modes"></div>
    <p class="rack-count" id="rack-count" aria-live="polite"></p>
  </nav>

  <main id="app" class="app" tabindex="-1"></main>

  <footer class="foot">
    <p>Fan game non officiel, sans lien avec Ankama Games.
      <button class="link" id="btn-legal">Mentions</button>
      <button class="link" id="btn-cache">Rafraîchir les données</button></p>
  </footer>

  <noscript><p class="noscript">Dofusle a besoin de JavaScript pour fonctionner.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
